<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body onload="fetchData();">
    <div>
        <h1>Welcome To Random Rocket</h1>
        <p>This is a website to showcase rocketry photos on command.</p>
        <button id="generate-all" onclick="generatePhoto(); generateVideo(); generateAudio();">Generate All</button>
        <div class="button-row">
            <button id="generate-photo" onclick="generatePhoto()">Generate Photo</button>
            <button id="generate-video" onclick="generateVideo()">Generate Video</button>
            <button id="generate-audio" onclick="generateAudio()">Generate Audio</button>
        </div>
        <div class="button-row">
            <button id="previous-photo" onclick="previousPhoto()">Previous Photo</button>
            <button id="previous-video" onclick="previousVideo()">Previous Video</button>
            <button id="previous-audio" onclick="previousAudio()">Previous Audio</button>
        </div>
        <form id="search-row" class="button-row" onsubmit="userSearch(); return false;">
            <input id="search-box"type="text" placeholder="Rocket Launch">
            <button id="search" type="submit"><i class="fa fa-search"></i></button>
        </form>
    </div>
    <div id="photo-container">
        <img id="photo" src="" alt="Rocket Photo">
    </div>
    <div id="description-container-photo">
        <p id="description-photo" alt="Rocket Description"></p>
    </div>
    <div id="video-container">
        <video id="video" controls></video>
    </div>
    <div id="description-container-video">
        <p id="description-video" alt="Rocket Description"></p>
    </div>
    <div id="audio-container">
        <audio id="audio" controls></audio>
    </div>
    <div id="description-container-audio">
        <p id="description-audio" alt="Rocket Description"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
